<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>She Said Yes 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background-color: pink;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

.container {
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 64px;  /* MÁS GRANDE */
    color: black;
    margin-bottom: 30px;
}

p {
    font-size: 32px;  /* MÁS GRANDE */
    color: black;
    margin: 15px 0;
}

/* Corazones flotando */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- 🎵 Música romántica libre de derechos -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c9c65a9f3.mp3?filename=romantic-love-112199.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>YAY!!! I knew you would say YES 🤍</h1>
    <p>You just made me the happiest person today ✨</p>
    <p>Now you officially owe me a date, see you soon!!! 🍓</p>
</div>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "🤍";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 10 + 18 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 700);
</script>

</body>
</html>
