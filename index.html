<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhea 💘</title>

<style>
body {
    margin: 0;
    text-align: center;
    font-family: Disney Font;
    background-color: pink;
    overflow: hidden;
}

h1 {
    margin-top: 120px;
    font-size: 60px;  /* MÁS GRANDE */
}

button {
    font-size: 22px;  /* MÁS GRANDE */
    padding: 14px 30px;
    margin: 20px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid black;
    background: white;
}

#noBtn {
    position: absolute;
}

/* Corazones flotando */
.heart {
    position: fixed;
    font-size: 22px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- 🎵 Música romántica libre de derechos -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c9c65a9f3.mp3?filename=romantic-love-112199.mp3" type="audio/mpeg">
</audio>

<h1>Rhea, do you wanna be my Valentine? 💖</h1>

<a href="yes.html">
    <button>YES 💘</button>
</a>

<button id="noBtn">NO 😏</button>

<script>

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
    noBtn.style.top = Math.random() * window.innerHeight + "px";
    noBtn.style.left = Math.random() * window.innerWidth + "px";
});

/* Crear corazones */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 18 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
