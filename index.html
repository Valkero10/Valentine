<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Rhea 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background-color: pink;
    font-family: 'Playfair Display', serif;
}

.container {
    max-width: 800px;
}

h1 {
    font-size: 38px;
    color: black;
    line-height: 1.5;
}

.buttons {
    margin-top: 40px;
    position: relative;
}

button {
    font-size: 18px;
    padding: 10px 25px;
    margin: 15px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid black;
    background: white;
    transition: 0.3s;
}

button:hover {
    background: black;
    color: white;
}

#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<div class="container">
    <h1>
        From the moment I met you,<br>
        I just wanna ask you,<br>
        Rhea,<br><br>
        do you wanna be my Valentine?
    </h1>

    <div class="buttons">
        <button onclick="yesClicked()">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>
function yesClicked() {
    window.location.href = "yes.html";
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
    noBtn.style.top = Math.random() * 200 + "px";
    noBtn.style.left = Math.random() * 300 + "px";
});
</script>

</body>
</html>
