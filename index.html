<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Rhea 💘</title>

<!-- Fuente estilo Disney -->
<style>
@import url('https://fonts.cdnfonts.com/css/waltograph');

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background-color: #ffc0cb; /* Rosado suave elegante */
    font-family: 'Waltograph', cursive;
}

.container {
    max-width: 800px;
}

h1 {
    font-size: 42px;
    color: black;
    line-height: 1.4;
}

.buttons {
    margin-top: 40px;
}

button {
    font-family: Arial, sans-serif;
    font-size: 18px;
    padding: 10px 25px;
    margin: 15px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid black;
    background: white;
}

#noBtn {
    position: absolute;
}
</style>
</head>

<body>

<!-- Música Perfect (YouTube oculto) -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/817P8W8-mGE?autoplay=1&loop=1&playlist=817P8W8-mGE"
frameborder="0"
allow="autoplay">
</iframe>

<div class="container">
    <h1>
        From the moment I met you,<br>
        I just wanna ask you,<br>
        Rhea,<br><br>
        do you wanna be my Valentine? 💘
    </h1>

    <div class="buttons">
        <button onclick="yesClicked()">Yes 🤍</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>

function yesClicked() {
    window.location.href = "yes.html";
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
    noBtn.style.top = Math.random() * window.innerHeight + "px";
    noBtn.style.left = Math.random() * window.innerWidth + "px";
});

</script>

</body>
</html>
