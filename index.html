<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Rhea 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background-color: pink;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

.container {
    max-width: 800px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 38px;
    color: black;
    line-height: 1.5;
}

.buttons {
    margin-top: 40px;
    position: relative;
}

button {
    font-size: 18px;
    padding: 10px 25px;
    margin: 15px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid black;
    background: white;
    transition: 0.3s;
}

button:hover {
    background: black;
    color: white;
}

#noBtn {
    position: absolute;
}

/* Corazones flotando */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 18px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- Música YouTube oculta -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/817P8W8-mGE?autoplay=1&loop=1&playlist=817P8W8-mGE"
frameborder="0"
allow="autoplay">
</iframe>

<div class="container">
    <h1>
       Rhea, do you wanna be my Valentine?
    </h1>

    <div class="buttons">
        <button onclick="yesClicked()">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>
function yesClicked() {
    window.location.href = "yes.html";
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
    noBtn.style.top = Math.random() * 200 + "px";
    noBtn.style.left = Math.random() * 300 + "px";
});

/* Crear corazones sutiles */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "🤍";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 10 + 14 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 800);
</script>

</body>
</html>
